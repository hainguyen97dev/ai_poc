[pytest]
# Only tests/ by default. ada-service/tests/ is deliberately excluded here and
# run as a *separate* `pytest ada-service/tests` invocation (see README /
# ada-service/conftest.py) — its `features` package has the same dotted name
# as this one's (agent-sa/features vs agent-sa/ada-service/features), and
# Python's sys.modules cache can only bind one of them to `features` per
# process. Two processes, no collision — mirrors the two apps being separate
# deployments already (CLI vs REST service).
testpaths = tests
python_files = test_*.py
